name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Run Python tests
        run: python3 -m unittest discover -s tests -v
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.9
          terraform_wrapper: false
      - name: Check Terraform formatting
        run: terraform -chdir=terraform fmt -check -recursive
      - name: Initialize Terraform providers
        run: terraform -chdir=terraform init -backend=false -input=false
      - name: Validate Terraform
        run: terraform -chdir=terraform validate -no-color
      - name: Lint GitHub Actions workflows
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color .github/workflows/test.yml github-workflows/app-store-reviews.yml
