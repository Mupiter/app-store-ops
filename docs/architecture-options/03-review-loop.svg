<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="title description">
  <title id="title">Option 3: review event loop</title>
  <desc id="description">GitHub Actions is at the center of an App Store review-to-Slack loop supported by AWS.</desc>
  <style>
    :root { --ink:#172033; --muted:#667085; --surface:#ffffff; --soft:#f7f8fa; --line:#cfd5df; --blue:#0969da; --blueSoft:#eaf3ff; }
    @media (prefers-color-scheme: dark) { :root { --ink:#f0f6fc; --muted:#9da7b3; --surface:#161b22; --soft:#0d1117; --line:#30363d; --blue:#58a6ff; --blueSoft:#071d36; } }
    .title{font:600 30px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:var(--ink)} .sub{font:400 16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:var(--muted)} .label{font:600 18px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:var(--ink)} .detail{font:400 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:var(--muted)} .chip{font:600 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:var(--blue)}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="var(--blue)"/></marker>
    <g id="github"><path fill="currentColor" d="M12 .7A11.3 11.3 0 0 0 8.4 22.7c.6.1.8-.3.8-.6v-2.2c-3.3.7-4-1.4-4-1.4-.5-1.4-1.3-1.7-1.3-1.7-1.1-.7.1-.7.1-.7 1.2.1 1.8 1.2 1.8 1.2 1.1 1.8 2.8 1.3 3.5 1 .1-.8.4-1.3.8-1.6-2.6-.3-5.3-1.3-5.3-5.8 0-1.3.5-2.3 1.2-3.1-.1-.3-.5-1.5.1-3.1 0 0 1-.3 3.2 1.2a11 11 0 0 1 5.8 0c2.2-1.5 3.2-1.2 3.2-1.2.6 1.6.2 2.8.1 3.1.8.8 1.2 1.8 1.2 3.1 0 4.5-2.7 5.5-5.3 5.8.4.4.8 1.1.8 2.2v3.3c0 .3.2.7.8.6A11.3 11.3 0 0 0 12 .7Z"/></g>
    <g id="slack"><rect x="7" y="1" width="6" height="13" rx="3" fill="#36c5f0"/><rect x="1" y="7" width="13" height="6" rx="3" fill="#36c5f0"/><rect x="11" y="10" width="13" height="6" rx="3" fill="#2eb67d"/><rect x="11" y="10" width="6" height="13" rx="3" fill="#2eb67d"/><rect x="10" y="11" width="13" height="6" rx="3" fill="#ecb22e"/><rect x="11" y="11" width="6" height="13" rx="3" fill="#ecb22e"/><rect x="1" y="11" width="13" height="6" rx="3" fill="#e01e5a"/><rect x="7" y="11" width="6" height="13" rx="3" fill="#e01e5a"/></g>
    <g id="aws"><text x="0" y="15" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#16191f">aws</text><path d="M1 20Q11 27 25 20" fill="none" stroke="#ff9900" stroke-width="2.5" stroke-linecap="round"/></g>
  </defs>
  <rect width="1200" height="500" rx="28" fill="var(--soft)"/>
  <text x="60" y="67" class="title">A simple loop, fully under your control.</text>
  <text x="60" y="97" class="sub">New feedback in, actionable context out—without another hosted dashboard.</text>

  <path d="M340 250C410 155 505 138 548 176" fill="none" stroke="var(--blue)" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M652 176C695 138 790 155 860 250" fill="none" stroke="var(--blue)" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M600 328V386" stroke="var(--blue)" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="398" y="177" class="chip">poll reviews</text><text x="746" y="177" class="chip">post notification</text><text x="616" y="366" class="chip">OIDC</text>

  <g transform="translate(90 200)">
    <circle cx="105" cy="55" r="90" fill="var(--surface)" stroke="var(--line)" stroke-width="1.5"/>
    <circle cx="105" cy="26" r="23" fill="#0a84ff"/><text x="96" y="34" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#fff">A</text>
    <text x="47" y="76" class="label">App Store</text><text x="35" y="101" class="detail">Customer reviews</text>
  </g>
  <g transform="translate(490 145)">
    <circle cx="110" cy="110" r="110" fill="var(--blueSoft)" stroke="var(--blue)" stroke-width="2"/>
    <circle cx="110" cy="69" r="32" fill="var(--ink)"/><g transform="translate(98 57) scale(1.02)" fill="var(--surface)"><use href="#github"/></g>
    <text x="49" y="131" class="label">GitHub Actions</text><text x="42" y="156" class="detail">Your review workflow</text>
    <rect x="43" y="172" width="134" height="26" rx="13" fill="var(--surface)"/><text x="63" y="190" class="chip">editable code</text>
  </g>
  <g transform="translate(900 200)">
    <circle cx="105" cy="55" r="90" fill="var(--surface)" stroke="var(--line)" stroke-width="1.5"/>
    <circle cx="105" cy="26" r="23" fill="#fff" stroke="#e4e8ee"/><g transform="translate(93 14) scale(.98)"><use href="#slack"/></g>
    <text x="72" y="76" class="label">Slack</text><text x="27" y="101" class="detail">Where your team works</text>
  </g>
  <g transform="translate(436 390)">
    <rect width="328" height="70" rx="18" fill="var(--surface)" stroke="var(--line)" stroke-width="1.5"/>
    <g transform="translate(26 24)"><use href="#aws"/></g><text x="94" y="33" class="label">AWS state</text><text x="94" y="54" class="detail">Private S3 watermark</text>
  </g>
</svg>
