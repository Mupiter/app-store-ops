<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="title description">
  <title id="title">Option 4: engineering blueprint</title>
  <desc id="description">A precise blueprinted architecture diagram for App Store reviews sent to Slack through GitHub and AWS.</desc>
  <style>
    .bg{fill:#0a2540}.grid{stroke:#1b4565;stroke-width:1}.ink{fill:#eaf4ff}.muted{fill:#a8c5dc}.line{stroke:#61c3ff;stroke-width:2}.dash{stroke:#61c3ff;stroke-width:2;stroke-dasharray:7 7}.title{font:600 30px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#fff}.sub{font:400 16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#a8c5dc}.label{font:600 18px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#fff}.detail{font:400 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#a8c5dc}.tag{font:600 12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#61c3ff;letter-spacing:.08em}
  </style>
  <defs>
    <pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse"><path d="M25 0H0V25" fill="none" class="grid" opacity=".55"/></pattern>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#61c3ff"/></marker>
    <g id="github"><path fill="currentColor" d="M12 .7A11.3 11.3 0 0 0 8.4 22.7c.6.1.8-.3.8-.6v-2.2c-3.3.7-4-1.4-4-1.4-.5-1.4-1.3-1.7-1.3-1.7-1.1-.7.1-.7.1-.7 1.2.1 1.8 1.2 1.8 1.2 1.1 1.8 2.8 1.3 3.5 1 .1-.8.4-1.3.8-1.6-2.6-.3-5.3-1.3-5.3-5.8 0-1.3.5-2.3 1.2-3.1-.1-.3-.5-1.5.1-3.1 0 0 1-.3 3.2 1.2a11 11 0 0 1 5.8 0c2.2-1.5 3.2-1.2 3.2-1.2.6 1.6.2 2.8.1 3.1.8.8 1.2 1.8 1.2 3.1 0 4.5-2.7 5.5-5.3 5.8.4.4.8 1.1.8 2.2v3.3c0 .3.2.7.8.6A11.3 11.3 0 0 0 12 .7Z"/></g>
    <g id="slack"><rect x="7" y="1" width="6" height="13" rx="3" fill="#36c5f0"/><rect x="1" y="7" width="13" height="6" rx="3" fill="#36c5f0"/><rect x="11" y="10" width="13" height="6" rx="3" fill="#2eb67d"/><rect x="11" y="10" width="6" height="13" rx="3" fill="#2eb67d"/><rect x="10" y="11" width="13" height="6" rx="3" fill="#ecb22e"/><rect x="11" y="11" width="6" height="13" rx="3" fill="#ecb22e"/><rect x="1" y="11" width="13" height="6" rx="3" fill="#e01e5a"/><rect x="7" y="11" width="6" height="13" rx="3" fill="#e01e5a"/></g>
    <g id="aws"><text x="0" y="15" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#fff">aws</text><path d="M1 20Q11 27 25 20" fill="none" stroke="#ffb000" stroke-width="2.5" stroke-linecap="round"/></g>
  </defs>
  <rect width="1200" height="500" rx="28" class="bg"/><rect width="1200" height="500" rx="28" fill="url(#grid)"/>
  <text x="60" y="67" class="title">Your App Store operations, drawn as infrastructure.</text>
  <text x="60" y="97" class="sub">Copy the pieces you need. Extend the pieces you own.</text>

  <path d="M290 240H445" class="line" marker-end="url(#arrow)"/><path d="M755 240H910" class="line" marker-end="url(#arrow)"/><path d="M600 310V365" class="dash" marker-end="url(#arrow)"/>
  <text x="330" y="218" class="tag">REVIEW DATA</text><text x="795" y="218" class="tag">NOTIFICATION</text><text x="615" y="342" class="tag">OIDC</text>

  <g transform="translate(70 170)"><rect width="220" height="140" rx="14" fill="#103450" stroke="#61c3ff" stroke-width="1.5"/><text x="24" y="30" class="tag">01 · APPLE</text><circle cx="44" cy="69" r="23" fill="#61c3ff"/><text x="35" y="77" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#0a2540">A</text><text x="80" y="66" class="label">App Store</text><text x="24" y="111" class="detail">Customer reviews API</text></g>
  <g transform="translate(445 150)"><rect width="310" height="160" rx="14" fill="#103450" stroke="#61c3ff" stroke-width="2"/><text x="24" y="30" class="tag">02 · YOUR REPOSITORY</text><circle cx="52" cy="80" r="28" fill="#fff"/><g transform="translate(40 68) scale(1.02)" fill="#0a2540"><use href="#github"/></g><text x="98" y="76" class="label">GitHub Actions</text><text x="98" y="101" class="detail">Scheduled review poller</text><path d="M24 127H286" stroke="#2b5a7a"/><text x="24" y="149" class="detail">Python · secrets · workflow YAML</text></g>
  <g transform="translate(910 170)"><rect width="220" height="140" rx="14" fill="#103450" stroke="#61c3ff" stroke-width="1.5"/><text x="24" y="30" class="tag">03 · DELIVERY</text><g transform="translate(29 51) scale(1.65)"><use href="#slack"/></g><text x="80" y="72" class="label">Slack</text><text x="24" y="111" class="detail">Incoming webhook</text></g>
  <g transform="translate(410 372)"><rect width="380" height="76" rx="14" fill="#103450" stroke="#61c3ff" stroke-width="1.5"/><text x="22" y="25" class="tag">04 · YOUR AWS ACCOUNT</text><g transform="translate(23 38)"><use href="#aws"/></g><text x="98" y="51" class="label">IAM role + private S3 state</text></g>
</svg>
